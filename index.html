<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verbi Italiani - 意大利语动词变位</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }



        body {

            font-family: 'Georgia', 'Times New Roman', serif;

            background-color: #FDF6F0;

            color: #3D2B1F;

            min-height: 100vh;

            padding-bottom: 60px;

        }



        /* Header */

        .header {

            text-align: center;

            padding: 40px 20px 20px;

            background: linear-gradient(180deg, #FDF6F0 0%, #F5EBE0 100%);

            border-bottom: 2px solid #E8D5C4;

        }



        .header h1 {

            font-size: 2.8em;

            font-weight: bold;

            color: #2C1810;

            margin-bottom: 8px;

            letter-spacing: 1px;

        }



        .header .subtitle {

            font-size: 1.05em;

            color: #8B6914;

            font-style: italic;

        }



        /* Search Bar */

        .search-container {

            max-width: 500px;

            margin: 20px auto 0;

            position: relative;

        }



        .search-container input {

            width: 100%;

            padding: 14px 50px 14px 20px;

            border: 2px solid #D4A574;

            border-radius: 30px;

            font-size: 1em;

            background: #FFF;

            color: #3D2B1F;

            outline: none;

            transition: border-color 0.3s;

        }



        .search-container input:focus {

            border-color: #B8860B;

        }



        .search-container input::placeholder {

            color: #C4A882;

        }



        .search-btn {

            position: absolute;

            right: 6px;

            top: 50%;

            transform: translateY(-50%);

            background: #B8860B;

            color: white;

            border: none;

            width: 38px;

            height: 38px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 1.1em;

            transition: background 0.3s;

        }



        .search-btn:hover {

            background: #9A7209;

        }



        /* Alphabet Index Bar */

        .alpha-index {

            max-width: 1200px;

            margin: 0 auto;

            padding: 15px 20px 0;

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 6px;

        }



        .alpha-btn {

            width: 36px;

            height: 36px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 1.5px solid #D4A574;

            background: #FFF;

            color: #6B4423;

            border-radius: 50%;

            cursor: pointer;

            font-size: 0.95em;

            font-weight: bold;

            font-family: inherit;

            transition: all 0.25s;

        }



        .alpha-btn:hover {

            background: #F5EBE0;

            transform: scale(1.1);

        }



        .alpha-btn.active {

            background: #B8860B;

            color: white;

            border-color: #B8860B;

            transform: scale(1.15);

            box-shadow: 0 2px 8px rgba(184, 134, 11, 0.35);

        }



        .alpha-btn.empty {

            opacity: 0.35;

            cursor: default;

            pointer-events: none;

        }



        /* Main Layout */

        .main-container {

            max-width: 1200px;

            margin: 0 auto;

            padding: 20px 20px 30px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 25px;

        }



        /* Section Headers */

        .section-header {

            padding: 16px 24px;

            border-radius: 10px 10px 0 0;

            color: white;

            font-size: 1.15em;

            font-weight: bold;

            text-align: center;

            letter-spacing: 0.5px;

        }



        .section-header.blue {

            background: linear-gradient(135deg, #1E5AA8 0%, #2E7DD3 100%);

        }



        .section-header.red {

            background: linear-gradient(135deg, #8B2500 0%, #B8390B 100%);

        }



        .section-header.gold {

            background: linear-gradient(135deg, #B8860B 0%, #DAA520 100%);

        }



        /* Cards */

        .card {

            background: #FFF;

            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.08);

            overflow: hidden;

            margin-bottom: 20px;

        }



        .card-body {

            padding: 20px 24px;

        }



        /* Verb Index List */

        .verb-list {

            max-height: 420px;

            overflow-y: auto;

            padding-right: 4px;

        }



        .verb-list::-webkit-scrollbar {

            width: 6px;

        }



        .verb-list::-webkit-scrollbar-track {

            background: #F5EBE0;

            border-radius: 3px;

        }



        .verb-list::-webkit-scrollbar-thumb {

            background: #D4A574;

            border-radius: 3px;

        }



        .verb-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 10px 14px;

            margin-bottom: 6px;

            border-radius: 8px;

            cursor: pointer;

            transition: all 0.2s;

            border: 1.5px solid transparent;

        }



        .verb-item:hover {

            background: #FDF8F3;

            border-color: #E8D5C4;

        }



        .verb-item.active {

            background: #E8F4FD;

            border-color: #1E5AA8;

        }



        .verb-item .verb-name {

            font-weight: 600;

            color: #2C1810;

            font-size: 1.05em;

        }



        .verb-item .verb-meaning {

            font-size: 0.9em;

            color: #8B6914;

        }



        .verb-item .verb-tag {

            font-size: 0.75em;

            padding: 2px 8px;

            border-radius: 10px;

            margin-left: 8px;

            font-weight: 500;

        }



        .verb-tag.irregular {

            background: #FFF8E8;

            color: #B8860B;

        }



        .verb-tag.regular {

            background: #E8FDF0;

            color: #0B8B3A;

        }



        /* Conjugation Table */

        .conj-table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 10px;

        }



        .conj-table th {

            background: #F5EBE0;

            color: #6B4423;

            padding: 10px 12px;

            text-align: left;

            font-weight: bold;

            border-bottom: 2px solid #E8D5C4;

        }



        .conj-table td {

            padding: 10px 12px;

            border-bottom: 1px solid #F0E6D8;

        }



        .conj-table tr:hover td {

            background: #FDF8F3;

        }



        .pronoun {

            color: #8B6914;

            font-weight: 600;

            width: 80px;

        }



        .conj-form {

            color: #2C1810;

            font-weight: 500;

        }



        .conj-form .highlight {

            color: #B8860B;

            font-weight: bold;

        }



        /* Tense Selector */

        .tense-selector {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 15px;

        }



        .tense-btn {

            padding: 8px 16px;

            border: 1.5px solid #D4A574;

            background: #FFF;

            color: #6B4423;

            border-radius: 20px;

            cursor: pointer;

            font-size: 0.9em;

            font-family: inherit;

            transition: all 0.3s;

        }



        .tense-btn:hover {

            background: #F5EBE0;

        }



        .tense-btn.active {

            background: #B8860B;

            color: white;

            border-color: #B8860B;

        }



        /* Verb Details */

        .detail-item {

            margin-bottom: 18px;

        }



        .detail-label {

            font-size: 0.85em;

            color: #8B6914;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 6px;

            font-weight: 600;

        }



        .detail-value {

            font-size: 1.05em;

            color: #2C1810;

            line-height: 1.6;

        }



        .detail-value.meaning {

            font-size: 1.3em;

            color: #1E5AA8;

            font-weight: bold;

        }



        .example-box {

            background: #FDF8F3;

            border-left: 4px solid #B8860B;

            padding: 14px 18px;

            border-radius: 0 8px 8px 0;

            margin-top: 10px;

        }



        .example-it {

            color: #2C1810;

            font-style: italic;

            margin-bottom: 4px;

        }



        .example-cn {

            color: #6B4423;

            font-size: 0.95em;

        }



        /* Tags */

        .tag-container {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 10px;

        }



        .tag {

            padding: 5px 12px;

            border-radius: 15px;

            font-size: 0.85em;

            font-weight: 500;

        }



        .tag.essere {

            background: #E8F4FD;

            color: #1E5AA8;

            border: 1px solid #B8D4F0;

        }



        .tag.avere {

            background: #FDEBE8;

            color: #8B2500;

            border: 1px solid #F0C4B8;

        }



        .tag.regular {

            background: #E8FDF0;

            color: #0B8B3A;

            border: 1px solid #B8F0C4;

        }



        .tag.irregular {

            background: #FFF8E8;

            color: #B8860B;

            border: 1px solid #F0E0B8;

        }



        /* Audio Button */

        .audio-btn {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 8px 16px;

            background: linear-gradient(135deg, #1E5AA8 0%, #2E7DD3 100%);

            color: white;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            font-size: 0.9em;

            font-family: inherit;

            transition: transform 0.2s, box-shadow 0.2s;

            margin-top: 10px;

        }



        .audio-btn:hover {

            transform: translateY(-2px);

            box-shadow: 0 4px 12px rgba(30, 90, 168, 0.3);

        }



        .audio-btn svg {

            width: 16px;

            height: 16px;

            fill: currentColor;

        }



        .index-label {

            font-size: 0.85em;

            color: #8B6914;

            text-align: center;

            margin-bottom: 12px;

            letter-spacing: 0.5px;

        }



        .index-count {

            color: #B8860B;

            font-weight: bold;

        }



        /* Mood Group Cards */

        .mood-group {

            margin-bottom: 20px;

        }



        .mood-group:last-child {

            margin-bottom: 0;

        }



        .mood-header {

            padding: 12px 20px;

            color: white;

            font-size: 1rem;

            font-weight: bold;

            letter-spacing: 0.5px;

            border-radius: 8px 8px 0 0;

            display: flex;

            align-items: center;

            gap: 8px;

        }



        .mood-header .mood-icon {

            font-size: 1.15em;

        }



        .matrix-wrap {

            overflow-x: auto;

            border: 1.5px solid #E8D5C4;

            border-top: none;

            border-radius: 0 0 8px 8px;

            background: #FFF;

        }



        .matrix-table {

            width: 100%;

            min-width: 480px;

            border-collapse: collapse;

            font-size: 0.88em;

        }



        .matrix-table th {

            background: #F5EBE0;

            color: #6B4423;

            padding: 8px 10px;

            text-align: center;

            font-weight: 600;

            border-bottom: 2px solid #E8D5C4;

            white-space: nowrap;

            font-size: 0.88em;

        }



        .matrix-table th:first-child {

            text-align: left;

            position: sticky;

            left: 0;

            background: #F5EBE0;

            z-index: 1;

            min-width: 72px;

        }



        .matrix-table td {

            padding: 7px 10px;

            border-bottom: 1px solid #F0E6D8;

            text-align: center;

            white-space: nowrap;

        }



        .matrix-table td:first-child {

            color: #8B6914;

            font-weight: 600;

            text-align: left;

            position: sticky;

            left: 0;

            background: #FFF;

            z-index: 1;

        }



        .matrix-table tr:hover td {

            background: #FDF8F3;

        }



        .matrix-table tr:hover td:first-child {

            background: #FDF8F3;

        }



        .matrix-table .tense-sub {

            font-size: 0.78em;

            color: #999;

            font-weight: normal;

            display: block;

        }



        /* Irregular verb row highlight — warm gold tint */

        .matrix-table .cell-irregular {

            background: #FFFCF5;

        }



        .matrix-table .cell-irregular:hover {

            background: #FFF8ED;

        }



        /* Non-personal irregular highlight */

        .np-irregular {

            border-color: #E8D5A8;

            background: #FFFCF5;

        }



        /* Gold highlight for verb endings in matrix tables */

        .highlight {

            color: #B8860B;

            font-weight: bold;

        }



        /* Non-personal mood (infinito, gerundio, participio) */

        .non-personal-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            padding: 16px 20px;

            border: 1.5px solid #E8D5C4;

            border-top: none;

            border-radius: 0 0 8px 8px;

            background: #FFF;

        }



        .non-personal-item {

            background: #FDF8F3;

            border: 1px solid #E8D5C4;

            border-radius: 8px;

            padding: 12px 16px;

        }



        .non-personal-item .np-label {

            font-size: 0.82em;

            color: #8B6914;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 3px;

            font-weight: 600;

        }



        .non-personal-item .np-form {

            color: #2C1810;

            font-size: 1.1em;

            font-weight: 500;

        }



        /* Responsive */

        @media (max-width: 900px) {

            .main-container {

                grid-template-columns: 1fr;

                padding: 12px 10px;

                gap: 12px;

            }

            .header {

                padding: 20px 12px 14px;

            }

            .header h1 {

                font-size: 2em;

                margin-bottom: 4px;

            }

            .header .subtitle {

                font-size: 0.9em;

            }

            .search-container {

                margin-top: 12px;

            }

            .search-container input {

                padding: 10px 44px 10px 14px;

                font-size: 0.9em;

            }

            .alpha-index {

                padding: 10px 10px 0;

                gap: 4px;

            }

            .alpha-btn {

                width: 28px;

                height: 28px;

                font-size: 0.8em;

            }

            .card-body {

                padding: 12px 14px;

            }

            .section-header {

                padding: 10px 14px;

                font-size: 1em;

            }

            /* Verb list - compact */

            .verb-list {

                max-height: 220px;

            }

            .verb-item {

                padding: 6px 10px;

                margin-bottom: 3px;

            }

            .verb-item .verb-name {

                font-size: 0.95em;

            }

            .verb-item .verb-meaning {

                font-size: 0.82em;

            }

            .index-label {

                font-size: 0.8em;

                margin-bottom: 8px;

            }

            /* Matrix table - bigger font, compact cells */

            .matrix-table {

                font-size: 0.92em;

                min-width: auto;

            }

            .matrix-table th {

                padding: 6px 6px;

                font-size: 0.85em;

            }

            .matrix-table td {

                padding: 5px 6px;

                font-size: 1.05em;

            }

            .matrix-table th:first-child {

                min-width: 50px;

                font-size: 0.85em;

            }

            .matrix-table td:first-child {

                font-size: 0.88em;

            }

            .non-personal-grid {

                grid-template-columns: 1fr;

                padding: 10px 14px;

                gap: 8px;

            }

            .non-personal-item {

                padding: 8px 12px;

            }

            .non-personal-item .np-form {

                font-size: 1.05em;

            }

            .mood-group {

                margin-bottom: 12px;

            }

            .mood-header {

                padding: 8px 14px;

                font-size: 0.9em;

            }

            /* Details section - compact */

            .detail-item {

                margin-bottom: 12px;

            }

            .detail-value {

                font-size: 0.95em;

                line-height: 1.5;

            }

            .detail-value.meaning {

                font-size: 1.15em;

            }

            .example-box {

                padding: 8px 12px;

                margin-top: 6px;

            }

            .example-it {

                font-size: 0.92em;

            }

            .example-cn {

                font-size: 0.85em;

            }

            .tag {

                font-size: 0.78em;

                padding: 3px 8px;

            }

            .audio-btn {

                padding: 6px 12px;

                font-size: 0.85em;

            }

            /* Tense showcase */

            #detailBody [style*="grid-template-columns:1fr 1fr"] {

                grid-template-columns: 1fr !important;

            }

            #detailBody [style*="1fr;gap:8px"] > div {

                padding: 8px 10px !important;

            }

        }



        @media (max-width: 600px) {

            .header h1 {

                font-size: 1.6em;

            }

            .alpha-btn {

                width: 24px;

                height: 24px;

                font-size: 0.75em;

            }

            .alpha-index {

                gap: 3px;

            }

            .matrix-table {

                font-size: 0.88em;

            }

            .matrix-table td {

                padding: 4px 4px;

                font-size: 1em;

            }

            .matrix-table th {

                font-size: 0.78em;

                padding: 4px 4px;

            }

            .non-personal-grid {

                grid-template-columns: 1fr;

            }

            .section-header {

                font-size: 0.88em;

                padding: 8px 12px;

            }

            .card-body {

                padding: 8px 10px;

            }

            .mood-header {

                font-size: 0.85em;

                padding: 6px 12px;

            }

            .detail-value {

                font-size: 0.9em;

            }

            .detail-value.meaning {

                font-size: 1.1em;

            }

            .verb-list {

                max-height: 180px;

            }

        }

    </style>

</head>

            const rules = getRules(m.type);

            if (!rules) return null;



            const auxT = (k) => AUX[m.aux][k];

            const pp = m.pp;

            const r = (arr) => isRfl ? REFL_PR.map((p,i) => p + " " + arr[i]) : arr;

            const cp = (k) => r(auxT(k).map(a => a + " " + pp));

            const end = (k, override) => {

                if (override) return r(override);

                const e = rules[k]; if (!e) return null;

                if (Array.isArray(e)) return r(e.map(ee => ee ? s + ee : ''));

                return [s + e]; // single string ending (inf, ger, ppres)

            };

            const endStr = (k) => Array.isArray(rules[k]) ? s + rules[k][0] : s + (rules[k] || "");



            // Handle string-style endings (inf, ger, ppres)

            const mkStr = (k) => s + (rules[k] || "");



            return {

                "presente": end("pres", m.pres),

                "passato": cp("pres"),

                "imperfetto": end("imperf", m.imperf),

                "trapassato": cp("imperf"),

                "remoto": end("rem", m.rem),

                "trapassato_remoto": cp("rem"),

                "futuro": end("fut", m.fut),

                "futuro_anteriore": cp("fut"),

                "congiuntivo": end("cong", m.cong),

                "cong_passato": cp("cong"),

                "cong_imperfetto": end("cong_imp", m.cong_imp),

                "cong_trapassato": cp("cong_imp"),

                "condizionale": end("cond", m.cond),

                "cond_passato": cp("cond"),

                "imperativo": end("impv", m.impv),

                "infinito": end("inf"),

                "infinito_passato": [m.aux + " " + pp],

                "gerundio": isRfl ? [mkStr("ger").replace(/ando$/, "andosi").replace(/endo$/, "endosi")] : end("ger"),

                "gerundio_passato": [AUX[m.aux].gerundio + " " + pp],

                "participio_pres": end("ppres"),

                "participio_pass": [pp],

            };

        }



        function getRules(type) {

                    imperf:["avo","avi","ava","avamo","avate","avano"],

                    rem:["ai","asti","ò","ammo","aste","arono"],

                    fut:["herò","herai","herà","heremo","herete","heranno"],

                    cong:["hi","hi","hi","hiamo","hiate","hino"],

                    cong_imp:["assi","assi","asse","assimo","aste","assero"],

                    impv:["","a","hi","hiamo","ate","hino"],

                    inf:"are", ger:"ando", ppres:"ante"

                },

                "iare": {

                    pres:["o","i","a","iamo","ate","ano"],

                    imperf:["avo","avi","ava","avamo","avate","avano"],

                    rem:["ai","asti","ò","ammo","aste","arono"],

                    fut:["erò","erai","erà","eremo","erete","eranno"],

                    cond:["erei","eresti","erebbe","eremmo","ereste","erebbero"],

                    cong:["i","i","i","iamo","iate","ino"],

                    cong_imp:["assi","assi","asse","assimo","aste","assero"],

                    impv:["","a","i","iamo","ate","ino"],

                    inf:"are", ger:"ando", ppres:"ante"

                },

                "ere": {

                    pres:["o","i","e","iamo","ete","ono"],

                    imperf:["evo","evi","eva","evamo","evate","evano"],

                    rem:["ei","esti","é","emmo","este","erono"],

                    fut:["erò","erai","erà","eremo","erete","eranno"],

                    cond:["erei","eresti","erebbe","eremmo","ereste","erebbero"],

                    cong:["a","a","a","iamo","iate","ano"],

                    cong_imp:["essi","essi","esse","essimo","este","essero"],

                    impv:["","i","a","iamo","ete","ano"],

                    inf:"ere", ger:"endo", ppres:"ente"

                },

                "ire": {

                    pres:["o","i","e","iamo","ite","ono"],

                    imperf:["ivo","ivi","iva","ivamo","ivate","ivano"],

                    rem:["ii","isti","ì","immo","iste","irono"],

                    fut:["irò","irai","irà","iremo","irete","iranno"],

                    cong_imp:["issi","issi","isse","issimo","iste","issero"],

                    impv:["","i","a","iamo","ite","ano"],

                    inf:"ire", ger:"endo", ppres:"ente"

                },

                "ire-isc": {

                    pres:["isco","isci","isce","iamo","ite","iscono"],

                    imperf:["ivo","ivi","iva","ivamo","ivate","ivano"],

                    rem:["ii","isti","ì","immo","iste","irono"],

                    fut:["irò","irai","irà","iremo","irete","iranno"],

                    cond:["irei","iresti","irebbe","iremmo","ireste","irebbero"],

                    cong_imp:["issi","issi","isse","issimo","iste","issero"],

                    impv:["","isci","isca","iamo","ite","iscano"],

                    inf:"ire", ger:"endo", ppres:"ente"

                },

            };

            const t = R[type];

            if (!t) return null;

            // Add string endings for non-array fields

            return {

                ...t,

                endStr: (e) => e,

            };

        }

            // For irregular verbs: ensure compound tenses exist

            if (!v.tenses) v.tenses = {};

        // ==================== ALPHABET INDEX ====================

        function renderAlphaIndex() {

            const container = document.getElementById('alphaIndex');

            const letters = "abcdefghijklmnopqrstuvwxyz".split("");

            letters.forEach(l => {

                const btn = document.createElement('button');

                btn.className = 'alpha-btn' + (verbData[l] ? '' : ' empty');

                btn.textContent = l.toUpperCase();

                btn.dataset.letter = l;

                if (verbData[l]) {

                    btn.onclick = () => selectLetter(l);

                }

                container.appendChild(btn);

            });

        }



        function selectLetter(l) {

            currentLetter = l;

            document.querySelectorAll('.alpha-btn').forEach(btn => {

                btn.classList.toggle('active', btn.dataset.letter === l);

            });

            renderVerbList(l);

        }



        // ==================== VERB LIST ====================

        function renderVerbList(l) {

            const list = document.getElementById('verbList');

            const label = document.getElementById('indexLabel');

            const header = document.getElementById('listHeader');

            const verbs = verbData[l] || [];



            header.innerHTML = `📇 动词索引 · Indice <span style="font-size:0.85em;opacity:0.9">— ${l.toUpperCase()}</span>`;

            label.innerHTML = `共 <span class="index-count">${verbs.length}</span> 个以 "${l.toUpperCase()}" 开头的动词`;



            list.innerHTML = '';

            if (verbs.length === 0) {

                list.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">暂无该字母开头的动词</div>';

                return;

            }



            verbs.forEach((v, idx) => {

                const item = document.createElement('div');

                item.className = 'verb-item' + (idx === 0 ? ' active' : '');

                item.innerHTML = `

                    <div>

                        <span class="verb-name">${v.infinito}</span>

                        <span class="verb-meaning">${v.meaning}</span>

                    </div>

                    <span class="verb-tag ${v.tags.includes('irregular') ? 'irregular' : 'regular'}">

                        ${v.tags.includes('irregular') ? '不规则' : '规则'}

                    </span>

                `;

                item.onclick = () => selectVerb(l, idx, item);

                list.appendChild(item);

            });



            if (verbs.length > 0) {

                selectVerb(l, 0, list.children[0]);

            }

        }



        // ==================== SELECT VERB ====================

        function selectVerb(l, idx, el) {

            currentVerb = verbData[l][idx];

            // Generate tenses on-demand for the selected verb
            ensureVerbTenses(currentVerb);

            document.querySelectorAll('.verb-item').forEach(i => i.classList.remove('active'));

            if (el) el.classList.add('active');

            renderConjugation();

            renderDetails();

        }



        // ==================== RENDER CONJUGATION BY MOOD ====================

        function renderConjugation() {

            const container = document.getElementById('conjugationContainer');

            if (!currentVerb) {

                container.innerHTML = '<div class="card" style="padding:40px;text-align:center;color:#999;">请选择动词</div>';

                return;

            }



            const v = currentVerb;

            const isIrr = v.tags && (v.tags.includes('irregular') || v.tags.includes('irregolare'));

            container.innerHTML = '';



            moodGroups.forEach(mood => {

                // Only keep tenses that have data

                const validTenses = mood.tenses.filter(t => v.tenses[t.key]);

                if (validTenses.length === 0) return; // Skip empty moods



                const groupDiv = document.createElement('div');

                groupDiv.className = 'mood-group';



                // Mood header

                const header = document.createElement('div');

                header.className = 'mood-header';

                header.style.background = `linear-gradient(135deg, ${mood.color} 0%, ${adjustColor(mood.color, 30)} 100%)`;

                header.innerHTML = `${mood.icon} ${mood.label}`;

                groupDiv.appendChild(header);



                // Check if all tenses for this mood are non-personal (len === 1)

                const allNonPersonal = validTenses.every(t => {

                    const forms = v.tenses[t.key];

                    return forms && forms.length === 1;

                });



                if (allNonPersonal) {

                    // Non-personal grid layout

                    const grid = document.createElement('div');

                    grid.className = 'non-personal-grid';

                    validTenses.forEach(t => {

                        const forms = v.tenses[t.key];

                        const item = document.createElement('div');

                        item.className = 'non-personal-item' + (isIrr ? ' np-irregular' : '');

                        item.innerHTML = `

                            <div class="np-label">${t.label}</div>

                            <div class="np-form">${highlightEnding(forms[0], 0, isIrr)}</div>

                        `;

                        grid.appendChild(item);

                    });

                    groupDiv.appendChild(grid);

                } else {

                    // Matrix table(s)

                    const breakIdx = mood.rowBreak || validTenses.length;

                    const chunks = [];

                    for (let i = 0; i < validTenses.length; i += breakIdx) {

                        chunks.push(validTenses.slice(i, i + breakIdx));

                    }



                    chunks.forEach((chunk, ci) => {

                        const wrap = document.createElement('div');

                        wrap.className = 'matrix-wrap';



                        const table = document.createElement('table');

                        table.className = 'matrix-table';



                        // Thead

                        const thead = document.createElement('thead');

                        const trHead = document.createElement('tr');

                        const thFirst = document.createElement('th');

                        thFirst.textContent = '人称';

                        trHead.appendChild(thFirst);



                        chunk.forEach(t => {

                            const th = document.createElement('th');

                            th.innerHTML = `${t.label}`;

                            trHead.appendChild(th);

                        });

                        thead.appendChild(trHead);

                        table.appendChild(thead);



                        // Tbody

                        const tbody = document.createElement('tbody');

                        pronouns.forEach((pronoun, pi) => {

                            const tr = document.createElement('tr');

                            const tdPronoun = document.createElement('td');

                            tdPronoun.textContent = pronoun;

                            tr.appendChild(tdPronoun);



                            chunk.forEach(t => {

                                const forms = v.tenses[t.key];

                                const td = document.createElement('td');

                                td.className = isIrr ? 'cell-irregular' : '';

                                if (forms && forms[pi]) {

                                    td.innerHTML = (forms[pi] === '' || forms[pi] === '—') ? '' : highlightEnding(forms[pi], pi, isIrr);

                                } else {

                                    td.innerHTML = '<span style="color:#ddd">—</span>';

                                }

                                tr.appendChild(td);

                            });

                            tbody.appendChild(tr);

                        });

                        table.appendChild(tbody);

                        wrap.appendChild(table);

                        groupDiv.appendChild(wrap);

                    });

                }



                container.appendChild(groupDiv);

            });

        }



        function adjustColor(hex, amount) {

            const num = parseInt(hex.replace('#', ''), 16);

            const r = Math.min(255, Math.max(0, (num >> 16) + amount));

            const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));

            const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));

            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

        }



        function highlightEnding(form, pi, isIrregular) {

            if (!form) return '';

            const parts = form.split(' ');

            const main = parts[parts.length - 1];

            const len = main.length;



            // Determine highlight length based on person index:

            // Io/Tu/Lui (0,1,2) → 2 chars; Noi/Voi/Loro (3,4,5) → 3 chars

            // For non-personal forms (pi is falsy/undefined), default to 2

            const hlLen = (pi === undefined || pi === null || pi < 3) ? 2 : 3;



            // If word is shorter than or equal to hlLen, highlight whole word

            if (len <= hlLen) {

                parts[parts.length - 1] = '<span class="highlight">' + main + '</span>';

                return parts.join(' ');

            }



            // Highlight last hlLen characters

            const stem = main.slice(0, -hlLen);

            const end = main.slice(-hlLen);

            parts[parts.length - 1] = stem + '<span class="highlight">' + end + '</span>';

            return parts.join(' ');

        }



        // ==================== RENDER DETAILS ====================

        function renderDetails() {

            const container = document.getElementById('detailBody');

            if (!currentVerb) {

                container.innerHTML = '<div style="text-align:center;color:#999;padding:40px;">请选择动词查看详情</div>';

                return;

            }



            const v = currentVerb;

            const isIrr = v.tags && (v.tags.includes('irregular') || v.tags.includes('irregolare'));

            const tagClass = v.tags.includes('ausiliare') ? (v.infinito === 'essere' ? 'essere' : 'avere') : (isIrr ? 'irregular' : 'regular');

            const tagText = v.tags.includes('ausiliare') ? '助动词 (ausiliare)' : (isIrr ? '不规则动词' : '规则动词');



            let examplesHtml = '';

            v.examples.forEach(ex => {

                examplesHtml += `

                    <div class="example-box">

                        <div class="example-it">${ex.it}</div>

                        <div class="example-cn">${ex.cn}</div>

                    </div>

                `;

            });



            let phrasesHtml = '';

            v.phrases.forEach(ph => {

                const parts = ph.split(' — ');

                phrasesHtml += `• <strong>${parts[0]}</strong>${parts[1] ? ` — ${parts[1]}` : ''}<br>`;

            });



            // Auto-generate tense showcase from conjugation data

            const tenseShowcase = [];

            const showcaseTenses = [

                {key: "presente", label: "现在时", ioIdx: 0, noiIdx: 3},

                {key: "passato", label: "近过去时", ioIdx: 0, noiIdx: 3},

                {key: "imperfetto", label: "未完成过去", ioIdx: 0, noiIdx: 3},

                {key: "futuro", label: "将来时", ioIdx: 0, noiIdx: 3},

            ];

            showcaseTenses.forEach(t => {

                if (v.tenses && v.tenses[t.key] && v.tenses[t.key].length > 3) {

                    const ioForm = v.tenses[t.key][t.ioIdx];

                    const noiForm = v.tenses[t.key][t.noiIdx];

                    if (ioForm !== '—' && ioForm !== '') {

                        tenseShowcase.push({label: t.label, io: ioForm, noi: noiForm});

                    }

                }

            });



            let showcaseHtml = '';

            if (tenseShowcase.length > 0) {

                showcaseHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;">`;

                tenseShowcase.forEach(t => {

                    showcaseHtml += `

                        <div style="background:#FDF8F3;border:1px solid #E8D5C4;border-radius:8px;padding:10px 14px;">

                            <div style="font-size:0.78em;color:#8B6914;font-weight:600;margin-bottom:4px;">🕐 ${t.label}</div>

                            <div style="color:#2C1810;font-size:0.95em;">

                                <span style="color:#8B6914;font-weight:500;">io</span> ${highlightEnding(t.io, 0, isIrr)}

                            </div>

                            <div style="color:#2C1810;font-size:0.95em;margin-top:2px;">

                                <span style="color:#8B6914;font-weight:500;">noi</span> ${highlightEnding(t.noi, 3, isIrr)}

                            </div>

                        </div>

                    `;

                });

                showcaseHtml += `</div>`;

            }



            container.innerHTML = `

                <div class="detail-item">

                    <div class="detail-label">动词原形 · Infinito</div>

                    <div class="detail-value" style="font-size: 1.6em; font-weight: bold; color: #8B2500;">${v.infinito}</div>

                </div>



                <div class="detail-item">

                    <div class="detail-label">中文含义 · Significato</div>

                    <div class="detail-value meaning">${v.meaning}</div>

                </div>



                <div class="detail-item">

                    <div class="detail-label">动词类别 · Categoria</div>

                    <div class="tag-container">

                        <span class="tag ${tagClass}">${tagText}</span>

                        <span class="tag">${v.category}</span>

                        ${v.tags.includes('riflessivo') ? '<span class="tag">自反动词</span>' : ''}

                    </div>

                </div>



                <div class="detail-item">

                    <div class="detail-label">变位特征 · Caratteristiche</div>

                    <div class="detail-value">${v.features}</div>

                </div>



                <div class="detail-item">

                    <div class="detail-label">助动词 · Ausiliare</div>

                    <div class="detail-value">

                        用 <strong>${v.aux}</strong> 构成复合时态

                    </div>

                </div>



                ${showcaseHtml ? `<div class="detail-item"><div class="detail-label">时态速览 · Panoramica</div>${showcaseHtml}</div>` : ''}



                <div class="detail-item">

                    <div class="detail-label">例句 · Esempi</div>

                    ${examplesHtml || '<div style="color:#999;">暂无例句</div>'}

                </div>



                <div class="detail-item">

                    <div class="detail-label">常见短语 · Frasi Comuni</div>

                    <div class="detail-value">${phrasesHtml || '暂无短语'}</div>

                </div>

            `;

        }



        // ==================== SEARCH ====================

        document.getElementById('verbSearch').addEventListener('input', function() {

            const q = this.value.trim().toLowerCase();

            if (!q) return;



            let best = null;

            const letters = Object.keys(verbData).sort();



            // Priority 1: exact match

            for (const l of letters) {

                for (let i = 0; i < verbData[l].length; i++) {

                    if (verbData[l][i].infinito.toLowerCase() === q) {

                        best = { l, i }; break;

                    }

                }

                if (best) break;

            }



            // Priority 2: starts with

            if (!best) {

                for (const l of letters) {

                    for (let i = 0; i < verbData[l].length; i++) {

                        if (verbData[l][i].infinito.toLowerCase().startsWith(q)) {

                            best = { l, i }; break;

                        }

                    }

                    if (best) break;

                }

            }



            // Priority 3: contains (substring)

            if (!best) {

                for (const l of letters) {

                    for (let i = 0; i < verbData[l].length; i++) {

                        if (verbData[l][i].infinito.toLowerCase().includes(q)) {

                            best = { l, i }; break;

                        }

                    }

                    if (best) break;

                }

            }



            if (best) {

                selectLetter(best.l);

                setTimeout(() => {

                    const items = document.querySelectorAll('.verb-item');

                    if (items[best.i]) {

                        items[best.i].scrollIntoView({behavior: 'smooth', block: 'center'});

                        selectVerb(best.l, best.i, items[best.i]);

                    }

                }, 50);

            }

        });



        // ==================== START ====================

        init();

    </script>
