<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verbi Italiani - 意大利语动词变位</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }



        body {

            font-family: 'Georgia', 'Times New Roman', serif;

            background-color: #FDF6F0;

            color: #3D2B1F;

            min-height: 100vh;

            padding-bottom: 60px;

        }



        /* Header */

        .header {

            text-align: center;

            padding: 40px 20px 20px;

            background: linear-gradient(180deg, #FDF6F0 0%, #F5EBE0 100%);

            border-bottom: 2px solid #E8D5C4;

        }



        .header h1 {

            font-size: 2.8em;

            font-weight: bold;

            color: #2C1810;

            margin-bottom: 8px;

            letter-spacing: 1px;

        }



        .header .subtitle {

            font-size: 1.05em;

            color: #8B6914;

            font-style: italic;

        }



        /* Search Bar */

        .search-container {

            max-width: 500px;

            margin: 20px auto 0;

            position: relative;

        }



        .search-container input {

            width: 100%;

            padding: 14px 50px 14px 20px;

            border: 2px solid #D4A574;

            border-radius: 30px;

            font-size: 1em;

            background: #FFF;

            color: #3D2B1F;

            outline: none;

            transition: border-color 0.3s;

        }



        .search-container input:focus {

            border-color: #B8860B;

        }



        .search-container input::placeholder {

            color: #C4A882;

        }



        .search-btn {

            position: absolute;

            right: 6px;

            top: 50%;

            transform: translateY(-50%);

            background: #B8860B;

            color: white;

            border: none;

            width: 38px;

            height: 38px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 1.1em;

            transition: background 0.3s;

        }



        .search-btn:hover {

            background: #9A7209;

        }



        /* Alphabet Index Bar */

        .alpha-index {

            max-width: 1200px;

            margin: 0 auto;

            padding: 15px 20px 0;

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 6px;

        }



        .alpha-btn {

            width: 36px;

            height: 36px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 1.5px solid #D4A574;

            background: #FFF;

            color: #6B4423;

            border-radius: 50%;

            cursor: pointer;

            font-size: 0.95em;

            font-weight: bold;

            font-family: inherit;

            transition: all 0.25s;

        }



        .alpha-btn:hover {

            background: #F5EBE0;

            transform: scale(1.1);

        }



        .alpha-btn.active {

            background: #B8860B;

            color: white;

            border-color: #B8860B;

            transform: scale(1.15);

            box-shadow: 0 2px 8px rgba(184, 134, 11, 0.35);

        }



        .alpha-btn.empty {

            opacity: 0.35;

            cursor: default;

            pointer-events: none;

        }



        /* Main Layout */

        .main-container {

            max-width: 1200px;

            margin: 0 auto;

            padding: 20px 20px 30px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 25px;

        }



        /* Section Headers */

        .section-header {

            padding: 16px 24px;

            border-radius: 10px 10px 0 0;

            color: white;

            font-size: 1.15em;

            font-weight: bold;

            text-align: center;

            letter-spacing: 0.5px;

        }



        .section-header.blue {

            background: linear-gradient(135deg, #1E5AA8 0%, #2E7DD3 100%);

        }



        .section-header.red {

            background: linear-gradient(135deg, #8B2500 0%, #B8390B 100%);

        }



        .section-header.gold {

            background: linear-gradient(135deg, #B8860B 0%, #DAA520 100%);

        }



        /* Cards */

        .card {

            background: #FFF;

            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.08);

            overflow: hidden;

            margin-bottom: 20px;

        }



        .card-body {

            padding: 20px 24px;

        }



        /* Verb Index List */

        .verb-list {

            max-height: 420px;

            overflow-y: auto;

            padding-right: 4px;

        }



        .verb-list::-webkit-scrollbar {

            width: 6px;

        }



        .verb-list::-webkit-scrollbar-track {

            background: #F5EBE0;

            border-radius: 3px;

        }



        .verb-list::-webkit-scrollbar-thumb {

            background: #D4A574;

            border-radius: 3px;

        }



        .verb-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 10px 14px;

            margin-bottom: 6px;

            border-radius: 8px;

            cursor: pointer;

            transition: all 0.2s;

            border: 1.5px solid transparent;

        }



        .verb-item:hover {

            background: #FDF8F3;

            border-color: #E8D5C4;

        }



        .verb-item.active {

            background: #E8F4FD;

            border-color: #1E5AA8;

        }



        .verb-item .verb-name {

            font-weight: 600;

            color: #2C1810;

            font-size: 1.05em;

        }



        .verb-item .verb-meaning {

            font-size: 0.9em;

            color: #8B6914;

        }



        .verb-item .verb-tag {

            font-size: 0.75em;

            padding: 2px 8px;

            border-radius: 10px;

            margin-left: 8px;

            font-weight: 500;

        }



        .verb-tag.irregular {

            background: #FFF8E8;

            color: #B8860B;

        }



        .verb-tag.regular {

            background: #E8FDF0;

            color: #0B8B3A;

        }



        /* Conjugation Table */

        .conj-table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 10px;

        }



        .conj-table th {

            background: #F5EBE0;

            color: #6B4423;

            padding: 10px 12px;

            text-align: left;

            font-weight: bold;

            border-bottom: 2px solid #E8D5C4;

        }



        .conj-table td {

            padding: 10px 12px;

            border-bottom: 1px solid #F0E6D8;

        }



        .conj-table tr:hover td {

            background: #FDF8F3;

        }



        .pronoun {

            color: #8B6914;

            font-weight: 600;

            width: 80px;

        }



        .conj-form {

            color: #2C1810;

            font-weight: 500;

        }



        .conj-form .highlight {

            color: #B8860B;

            font-weight: bold;

        }



        /* Tense Selector */

        .tense-selector {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 15px;

        }



        .tense-btn {

            padding: 8px 16px;

            border: 1.5px solid #D4A574;

            background: #FFF;

            color: #6B4423;

            border-radius: 20px;

            cursor: pointer;

            font-size: 0.9em;

            font-family: inherit;

            transition: all 0.3s;

        }



        .tense-btn:hover {

            background: #F5EBE0;

        }



        .tense-btn.active {

            background: #B8860B;

            color: white;

            border-color: #B8860B;

        }



        /* Verb Details */

        .detail-item {

            margin-bottom: 18px;

        }



        .detail-label {

            font-size: 0.85em;

            color: #8B6914;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 6px;

            font-weight: 600;

        }



        .detail-value {

            font-size: 1.05em;

            color: #2C1810;

            line-height: 1.6;

        }



        .detail-value.meaning {

            font-size: 1.3em;

            color: #1E5AA8;

            font-weight: bold;

        }



        .example-box {

            background: #FDF8F3;

            border-left: 4px solid #B8860B;

            padding: 14px 18px;

            border-radius: 0 8px 8px 0;

            margin-top: 10px;

        }



        .example-it {

            color: #2C1810;

            font-style: italic;

            margin-bottom: 4px;

        }



        .example-cn {

            color: #6B4423;

            font-size: 0.95em;

        }



        /* Tags */

        .tag-container {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 10px;

        }



        .tag {

            padding: 5px 12px;

            border-radius: 15px;

            font-size: 0.85em;

            font-weight: 500;

        }



        .tag.essere {

            background: #E8F4FD;

            color: #1E5AA8;

            border: 1px solid #B8D4F0;

        }



        .tag.avere {

            background: #FDEBE8;

            color: #8B2500;

            border: 1px solid #F0C4B8;

        }



        .tag.regular {

            background: #E8FDF0;

            color: #0B8B3A;

            border: 1px solid #B8F0C4;

        }



        .tag.irregular {

            background: #FFF8E8;

            color: #B8860B;

            border: 1px solid #F0E0B8;

        }

        .tag-level {

            background: #F0E6FF;

            color: #6B3FA0;

            border: 1px solid #D4C0EF;

            line-height: 1;

            display: inline-flex;

            align-items: center;

        }



        /* Audio Button */

        .audio-btn {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 8px 16px;

            background: linear-gradient(135deg, #1E5AA8 0%, #2E7DD3 100%);

            color: white;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            font-size: 0.9em;

            font-family: inherit;

            transition: transform 0.2s, box-shadow 0.2s;

            margin-top: 10px;

        }



        .audio-btn:hover {

            transform: translateY(-2px);

            box-shadow: 0 4px 12px rgba(30, 90, 168, 0.3);

        }



        .audio-btn svg {

            width: 16px;

            height: 16px;

            fill: currentColor;

        }



        .index-label {

            font-size: 0.85em;

            color: #8B6914;

            text-align: center;

            margin-bottom: 12px;

            letter-spacing: 0.5px;

        }



        .index-count {

            color: #B8860B;

            font-weight: bold;

        }



        /* Mood Group Cards */

        .mood-group {

            margin-bottom: 20px;

        }



        .mood-group:last-child {

            margin-bottom: 0;

        }



        .mood-header {

            padding: 12px 20px;

            color: white;

            font-size: 1rem;

            font-weight: bold;

            letter-spacing: 0.5px;

            border-radius: 8px 8px 0 0;

            display: flex;

            align-items: center;

            gap: 8px;

        }



        .mood-header .mood-icon {

            font-size: 1.15em;

        }



        .matrix-wrap {

            overflow-x: auto;

            border: 1.5px solid #E8D5C4;

            border-top: none;

            border-radius: 0 0 8px 8px;

            background: #FFF;

        }



        .matrix-table {

            width: 100%;

            min-width: 480px;

            border-collapse: collapse;

            font-size: 0.88em;

        }



        .matrix-table th {

            background: #F5EBE0;

            color: #6B4423;

            padding: 8px 10px;

            text-align: center;

            font-weight: 600;

            border-bottom: 2px solid #E8D5C4;

            white-space: nowrap;

            font-size: 0.88em;

        }



        .matrix-table th:first-child {

            text-align: left;

            position: sticky;

            left: 0;

            background: #F5EBE0;

            z-index: 1;

            min-width: 72px;

        }



        .matrix-table td {

            padding: 7px 10px;

            border-bottom: 1px solid #F0E6D8;

            text-align: center;

            white-space: nowrap;

        }



        .matrix-table td:first-child {

            color: #8B6914;

            font-weight: 600;

            text-align: left;

            position: sticky;

            left: 0;

            background: #FFF;

            z-index: 1;

        }



        .matrix-table tr:hover td {

            background: #FDF8F3;

        }



        .matrix-table tr:hover td:first-child {

            background: #FDF8F3;

        }



        .matrix-table .tense-sub {

            font-size: 0.78em;

            color: #999;

            font-weight: normal;

            display: block;

        }



        /* Irregular verb row highlight — warm gold tint */

        .matrix-table .cell-irregular {

            background: #FFFCF5;

        }



        .matrix-table .cell-irregular:hover {

            background: #FFF8ED;

        }



        /* Non-personal irregular highlight */

        .np-irregular {

            border-color: #E8D5A8;

            background: #FFFCF5;

        }



        /* Gold highlight for verb endings in matrix tables */

        .highlight {

            color: #B8860B;

            font-weight: bold;

        }



        /* Non-personal mood (infinito, gerundio, participio) */

        .non-personal-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            padding: 16px 20px;

            border: 1.5px solid #E8D5C4;

            border-top: none;

            border-radius: 0 0 8px 8px;

            background: #FFF;

        }



        .non-personal-item {

            background: #FDF8F3;

            border: 1px solid #E8D5C4;

            border-radius: 8px;

            padding: 12px 16px;

        }



        .non-personal-item .np-label {

            font-size: 0.82em;

            color: #8B6914;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 3px;

            font-weight: 600;

        }



        .non-personal-item .np-form {

            color: #2C1810;

            font-size: 1.1em;

            font-weight: 500;

        }



        /* Responsive */

        @media (max-width: 900px) {

            .main-container {

                grid-template-columns: 1fr;

                padding: 12px 10px;

                gap: 12px;

            }

            .header {

                padding: 20px 12px 14px;

            }

            .header h1 {

                font-size: 2em;

                margin-bottom: 4px;

            }

            .header .subtitle {

                font-size: 0.9em;

            }

            .search-container {

                margin-top: 12px;

            }

            .search-container input {

                padding: 10px 44px 10px 14px;

                font-size: 0.9em;

            }

            .alpha-index {

                padding: 10px 10px 0;

                gap: 4px;

            }

            .alpha-btn {

                width: 28px;

                height: 28px;

                font-size: 0.8em;

            }

            .card-body {

                padding: 12px 14px;

            }

            .section-header {

                padding: 10px 14px;

                font-size: 1em;

            }

            /* Verb list - compact */

            .verb-list {

                max-height: 220px;

            }

            .verb-item {

                padding: 6px 10px;

                margin-bottom: 3px;

            }

            .verb-item .verb-name {

                font-size: 0.95em;

            }

            .verb-item .verb-meaning {

                font-size: 0.82em;

            }

            .index-label {

                font-size: 0.8em;

                margin-bottom: 8px;

            }

            /* Matrix table - bigger font, compact cells */

            .matrix-table {

                font-size: 0.92em;

                min-width: auto;

            }

            .matrix-table th {

                padding: 6px 6px;

                font-size: 0.85em;

            }

            .matrix-table td {

                padding: 5px 6px;

                font-size: 1.05em;

            }

            .matrix-table th:first-child {

                min-width: 50px;

                font-size: 0.85em;

            }

            .matrix-table td:first-child {

                font-size: 0.88em;

            }

            .non-personal-grid {

                grid-template-columns: 1fr;

                padding: 10px 14px;

                gap: 8px;

            }

            .non-personal-item {

                padding: 8px 12px;

            }

            .non-personal-item .np-form {

                font-size: 1.05em;

            }

            .mood-group {

                margin-bottom: 12px;

            }

            .mood-header {

                padding: 8px 14px;

                font-size: 0.9em;

            }

            /* Details section - compact */

            .detail-item {

                margin-bottom: 12px;

            }

            .detail-value {

                font-size: 0.95em;

                line-height: 1.5;

            }

            .detail-value.meaning {

                font-size: 1.15em;

            }

            .example-box {

                padding: 8px 12px;

                margin-top: 6px;

            }

            .example-it {

                font-size: 0.92em;

            }

            .example-cn {

                font-size: 0.85em;

            }

            .tag {

                font-size: 0.78em;

                padding: 3px 8px;

            }

            .audio-btn {

                padding: 6px 12px;

                font-size: 0.85em;

            }

            /* Tense showcase */

            #detailBody [style*="grid-template-columns:1fr 1fr"] {

                grid-template-columns: 1fr !important;

            }

            #detailBody [style*="1fr;gap:8px"] > div {

                padding: 8px 10px !important;

            }

        }



        @media (max-width: 600px) {

            .header h1 {

                font-size: 1.6em;

            }

            .alpha-btn {

                width: 24px;

                height: 24px;

                font-size: 0.75em;

            }

            .alpha-index {

                gap: 3px;

            }

            .matrix-table {

                font-size: 0.88em;

            }

            .matrix-table td {

                padding: 4px 4px;

                font-size: 1em;

            }

            .matrix-table th {

                font-size: 0.78em;

                padding: 4px 4px;

            }

            .non-personal-grid {

                grid-template-columns: 1fr;

            }

            .section-header {

                font-size: 0.88em;

                padding: 8px 12px;

            }

            .card-body {

                padding: 8px 10px;

            }

            .mood-header {

                font-size: 0.85em;

                padding: 6px 12px;

            }

            .detail-value {

                font-size: 0.9em;

            }

            .detail-value.meaning {

                font-size: 1.1em;

            }

            .verb-list {

                max-height: 180px;

            }

        }

    </style>

</head>

<body>

    <header class="header">

        <h1>Verbi Italiani</h1>

        <p class="subtitle">意大利语动词变位查询 · Coniugazione dei Verbi</p>

        <div class="search-container">

            <input type="text" placeholder="输入动词原形，如：essere, avere, parlare..." id="verbSearch">

            <button class="search-btn">🔍</button>

        </div>

    </header>



    <!-- Alphabet Index -->

    <div class="alpha-index" id="alphaIndex"></div>



    <main class="main-container">

        <!-- LEFT: Verb List + Conjugation -->

        <div class="left-section">

            <!-- Verb Index List -->

            <div class="card">

                <div class="section-header gold" id="listHeader">

                    📇 动词索引 · Indice

                </div>

                <div class="card-body">

                    <div class="index-label" id="indexLabel">点击上方字母浏览动词</div>

                    <div class="verb-list" id="verbList"></div>

                </div>

            </div>



            <!-- Conjugation Tables by Mood -->

            <div id="conjugationContainer"></div>



            <!-- Auxiliary Verbs Quick Ref -->

            <div class="card">

                <div class="section-header blue" style="background: linear-gradient(135deg, #2E7DD3 0%, #5BA3F5 100%);">

                    ⚡ 助动词速查 · Ausiliari

                </div>

                <div class="card-body">

                    <table class="conj-table">

                        <thead>

                            <tr>

                                <th></th>

                                <th>essere</th>

                                <th>avere</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr><td class="pronoun">Io</td><td>sono</td><td>ho</td></tr>

                            <tr><td class="pronoun">Tu</td><td>sei</td><td>hai</td></tr>

                            <tr><td class="pronoun">Lui/Lei</td><td>è</td><td>ha</td></tr>

                            <tr><td class="pronoun">Noi</td><td>siamo</td><td>abbiamo</td></tr>

                            <tr><td class="pronoun">Voi</td><td>siete</td><td>avete</td></tr>

                            <tr><td class="pronoun">Loro</td><td>sono</td><td>hanno</td></tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>



        <!-- RIGHT: Verb Details -->

        <div class="right-section">

            <div class="card">

                <div class="section-header red">

                    📖 动词详情 · Dettagli del Verbo

                </div>

                <div class="card-body" id="detailBody"></div>

            </div>

        </div>

    </main>



    
<div id="loadStatus" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;">
    <div style="width:50px;height:50px;border:4px solid #E8D5C4;border-top:4px solid #B8860B;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:25px;"></div>
    <div style="font-size:1.3em;color:#6B4423;font-weight:bold;">⏳ Caricamento dei verbi...</div>
    <div style="font-size:0.9em;color:#999;margin-top:8px;">加载动词数据中，请稍候</div>
</div>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
        // Show loading state immediately
        document.getElementById('loadStatus').style.display = 'flex';
        
        // Load verb-data.js after engine.js (deferred)
        // Engine sets up __verbDataReady callback, verb-data.js triggers it
    </script>
    <script defer src="engine.js"></script>
    <script defer src="verb-data.js"></script>
</body>

</html>
